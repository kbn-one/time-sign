name: CI
on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Type check, lint, format
        run: deno task check

      - name: Test
        run: deno task test

      - name: Build client library
        run: deno task build:lib

      # Static site + Worker, arranged for `cf deploy --prebuilt`.
      - name: Build for Cloudflare
        run: deno task build:cf

      - name: Deploy (dry run)
        run: deno task -q cf deploy --prebuilt --dry-run

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # never run concurrently with a key rotation
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Build for Cloudflare
        run: deno task build:cf

      # Code-only deploy: IBKEM_* secrets already stored on the Worker are kept.
      # They are only (re)written by .github/workflows/keygen.yml, which also
      # creates the Worker on its first run; until then this step is skipped.
      - name: Deploy to Cloudflare Workers
        run: |
          set +e
          deno task -q cf deploy --prebuilt --message "${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && tr '\n' ' ' < "$RUNNER_TEMP/deploy.log" | sed 's/│//g; s/  */ /g' | grep -q "Worker does not exist yet"; then
            echo "::warning::Worker not created yet. Run the 'Generate master key' workflow (input: rotate) to create it with a key pair."
            exit 0
          fi
          exit "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
