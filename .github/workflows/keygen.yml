name: Generate master key
# Generates a fresh IBKEM master key pair inside this job, stores both keys as
# Cloudflare Worker secrets and publishes the public key with a signed build
# provenance attestation. The secret key never leaves this job except to
# Cloudflare: it is not printed, committed, uploaded as an artifact or stored
# in GitHub secrets.
#
# Rotating the key makes every ciphertext encrypted for the previous public
# key undecryptable, so this only runs on demand.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rotate" to replace the master key pair (old ciphertexts become undecryptable)'
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  keygen:
    name: Generate key pair and deploy
    if: inputs.confirm == 'rotate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
      id-token: write # Sigstore signing certificate
      attestations: write
      artifact-metadata: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build worker
        run: deno task build:worker

      - name: Generate key pair
        run: deno task genkey "$RUNNER_TEMP/key"

      - name: Deploy to Cloudflare Workers with the new key pair
        run: |
          npx cf deploy \
            --secrets-file "$RUNNER_TEMP/key/secrets.json" \
            --message "master key generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove secret key
        if: always()
        run: rm -f "$RUNNER_TEMP/key/secrets.json"

      - name: Attest public key
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/key/master_pk.bin

      - name: Publish public key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pk="$RUNNER_TEMP/key/master_pk.bin"
          tag="master-key-$(date -u +%Y%m%dT%H%M%SZ)"
          sha256=$(sha256sum "$pk" | cut -d' ' -f1)
          gh release create "$tag" "$pk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Master public key generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          sha256: \`${sha256}\`

          Verify: \`gh attestation verify master_pk.bin -R ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/keygen.yml\`"
          {
            echo "## Master public key"
            echo
            echo "- release: \`${tag}\`"
            echo "- sha256: \`${sha256}\`"
            echo
            echo '```'
            base64 -w0 "$pk"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
